<svg xmlns="http://www.w3.org/2000/svg" width="1221" height="1366" viewBox="0 0 1221 1366" role="img" aria-labelledby="title desc">
  <title id="title">Django review reporting and auto-hide code</title>
  <desc id="desc">A dark code screenshot of the Django Report model and report_review view that hides a review after three distinct user reports.</desc>
  <rect width="1221" height="1366" fill="#1f262b" />
  <rect x="0" y="0" width="1221" height="8" fill="#2b3338" />
  <g font-family="'Cascadia Code', 'Consolas', monospace" font-size="26" xml:space="preserve">
    <text x="18" y="46" xml:space="preserve"><tspan fill="#6a9955"># movies/models.py - one knob controls how strict moderation is</tspan></text>
    <text x="18" y="84" xml:space="preserve"><tspan fill="#f5f5f5">REPORT_THRESHOLD</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#4fc1ff">3</tspan></text>
    <text x="18" y="160" xml:space="preserve"><tspan fill="#c586c0">class</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#4ec9b0">Report</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">Model</tspan><tspan fill="#f5f5f5">)</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="80.4" y="198" xml:space="preserve"><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">ForeignKey</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">Review</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">on_delete</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">CASCADE</tspan><tspan fill="#f5f5f5">,</tspan></text>
    <text x="142.8" y="236" xml:space="preserve"><tspan fill="#f5f5f5">related_name</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">reports</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="274" xml:space="preserve"><tspan fill="#f5f5f5">user</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">ForeignKey</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">User</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">on_delete</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">CASCADE</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="312" xml:space="preserve"><tspan fill="#f5f5f5">reason</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">CharField</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">max_length</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#4fc1ff">20</tspan><tspan fill="#f5f5f5">,</tspan></text>
    <text x="142.8" y="350" xml:space="preserve"><tspan fill="#f5f5f5">choices</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">REASON_CHOICES</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">default</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">other</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="426" xml:space="preserve"><tspan fill="#c586c0">class</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#4ec9b0">Meta</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="142.8" y="464" xml:space="preserve"><tspan fill="#f5f5f5">constraints</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">[</tspan><tspan fill="#f5f5f5">                     </tspan><tspan fill="#6a9955"># one report per user per review</tspan></text>
    <text x="205.2" y="502" xml:space="preserve"><tspan fill="#f5f5f5">models</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">UniqueConstraint</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">fields</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">[</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">review</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">user</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">]</tspan><tspan fill="#f5f5f5">,</tspan></text>
    <text x="267.6" y="540" xml:space="preserve"><tspan fill="#f5f5f5">name</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">unique_report_per_user_per_review</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="142.8" y="578" xml:space="preserve"><tspan fill="#f5f5f5">]</tspan></text>
    <text x="18" y="654" xml:space="preserve"><tspan fill="#6a9955"># movies/views.py - auto-hide a review once enough users flag it</tspan></text>
    <text x="18" y="692" xml:space="preserve"><tspan fill="#ffb02e">@login_required</tspan></text>
    <text x="18" y="730" xml:space="preserve"><tspan fill="#c586c0">def</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#ffb02e">report_review</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">request</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">review_id</tspan><tspan fill="#f5f5f5">)</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="80.4" y="768" xml:space="preserve"><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">get_object_or_404</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">Review</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">review_id</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">movie_id</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="806" xml:space="preserve"><tspan fill="#c586c0">if</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">user</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">==</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">request</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">user</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="142.8" y="844" xml:space="preserve"><tspan fill="#f5f5f5">messages</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">error</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">request</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">You cannot report your own review.</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="142.8" y="882" xml:space="preserve"><tspan fill="#c586c0">return</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">redirect</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">movies.show</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="958" xml:space="preserve"><tspan fill="#f5f5f5">report</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">created</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">Report</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">objects</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">get_or_create</tspan><tspan fill="#f5f5f5">(</tspan></text>
    <text x="142.8" y="996" xml:space="preserve"><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">user</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">request</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">user</tspan><tspan fill="#f5f5f5">,</tspan></text>
    <text x="142.8" y="1034" xml:space="preserve"><tspan fill="#f5f5f5">defaults</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5">{</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">reason</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">:</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">reason</tspan><tspan fill="#f5f5f5">}</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="1072" xml:space="preserve"><tspan fill="#c586c0">if</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">not</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">created</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="142.8" y="1110" xml:space="preserve"><tspan fill="#f5f5f5">messages</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">info</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">request</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">You have already reported this review.</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="142.8" y="1148" xml:space="preserve"><tspan fill="#c586c0">return</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">redirect</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">movies.show</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="1224" xml:space="preserve"><tspan fill="#c586c0">if</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">reports</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">count</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">)</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">&gt;</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">REPORT_THRESHOLD</tspan><tspan fill="#f5f5f5">:</tspan></text>
    <text x="142.8" y="1262" xml:space="preserve"><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">is_hidden</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#4fc1ff">True</tspan></text>
    <text x="142.8" y="1300" xml:space="preserve"><tspan fill="#f5f5f5">review</tspan><tspan fill="#f5f5f5">.</tspan><tspan fill="#f5f5f5">save</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#f5f5f5">)</tspan></text>
    <text x="80.4" y="1338" xml:space="preserve"><tspan fill="#c586c0">return</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#f5f5f5">redirect</tspan><tspan fill="#f5f5f5">(</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#ce9178">movies.show</tspan><tspan fill="#ce9178">'</tspan><tspan fill="#f5f5f5">,</tspan><tspan fill="#f5f5f5"> </tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">=</tspan><tspan fill="#00b7c3">id</tspan><tspan fill="#f5f5f5">)</tspan></text>
  </g>
</svg>
